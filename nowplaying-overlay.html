<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent: rgba(30,185,84,0.55);
    --accent-solid: #1ed760;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:transparent;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}

  #card{
    position:fixed;
    bottom:28px;
    left:28px;
    width:380px;
    background:rgba(10,10,12,0.78);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
    padding:18px 20px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    transform:translateY(calc(100% + 40px)) scale(0.96);
    opacity:0;
    will-change:transform,opacity,width,padding;
    transition:
      transform 0.7s cubic-bezier(0.22,1,0.36,1),
      opacity 0.5s cubic-bezier(0.22,1,0.36,1),
      width 0.55s cubic-bezier(0.65,0,0.35,1),
      padding 0.55s cubic-bezier(0.65,0,0.35,1),
      box-shadow 0.5s ease;
    box-shadow:0 30px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05) inset, 0 0 40px var(--accent);
  }
  #card.show{transform:translateY(0) scale(1);opacity:1;}
  #card.compact{width:290px;padding:14px 16px;gap:10px;}
  #card.compact .viz-wrap{opacity:0;max-height:0;pointer-events:none;}
  #card.compact .bottom-row{opacity:0;max-height:0;margin:0;}
  #card.compact .track-artist{margin-bottom:0;}

  .track-row{display:flex;align-items:center;gap:15px;}

  .art-wrap{position:relative;flex-shrink:0;width:72px;height:72px;}
  #album-art{
    width:100%;height:100%;border-radius:12px;object-fit:cover;display:block;
    background:#161616;
    transition:transform 0.5s cubic-bezier(0.22,1,0.36,1), opacity 0.4s ease, filter 0.5s ease;
    will-change:transform,opacity;
  }
  .art-glow{
    position:absolute;inset:-10px;border-radius:22px;z-index:-1;
    opacity:0;filter:blur(20px);
    background:var(--accent);
    transition:background 1s ease, opacity 0.9s ease;
  }
  #card.show .art-glow{opacity:0.65;}
  .art-ring{
    position:absolute;inset:-3px;border-radius:14px;
    border:2px solid transparent;
    background:conic-gradient(from 0deg, var(--accent-solid), transparent 40%);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
    opacity:0;
    transition:opacity 0.4s ease;
    animation:spin 4s linear infinite;
  }
  #card.show:not(.paused) .art-ring{opacity:0.9;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .info{flex:1;min-width:0;}
  .track-title{
    font-size:16px;font-weight:700;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.3;margin-bottom:4px;
    transition:opacity 0.3s ease, transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .track-artist{
    font-size:13.5px;color:rgba(255,255,255,0.55);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:9px;
    transition:opacity 0.3s ease, transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .info.changing .track-title, .info.changing .track-artist{
    opacity:0;transform:translateY(-8px);
  }

  .bottom-row{
    display:flex;align-items:center;justify-content:space-between;
    transition:opacity 0.35s ease, max-height 0.4s ease, margin 0.4s ease;
    max-height:20px;overflow:hidden;
  }
  .time-label{font-size:11px;color:rgba(255,255,255,0.35);font-variant-numeric:tabular-nums;letter-spacing:0.02em;}
  .sp-badge{display:flex;align-items:center;gap:5px;opacity:0.5;}
  .sp-badge span{font-size:11px;font-weight:600;color:#fff;letter-spacing:0.03em;}

  .viz-wrap{
    position:relative;height:48px;width:100%;
    transition:opacity 0.35s ease, max-height 0.4s ease;
    max-height:48px;overflow:hidden;
  }
  #viz{width:100%;height:100%;display:block;}

  #card.paused #album-art{filter:brightness(0.6) saturate(0.4);}
  #card.paused .track-title{opacity:0.55;}
  #card.paused .track-artist{opacity:0.35;}
  #card.paused .art-ring{opacity:0;}
</style>
</head>
<body>
  <div id="card">
    <div class="track-row">
      <div class="art-wrap">
        <div class="art-glow" id="glow"></div>
        <div class="art-ring" id="ring"></div>
        <img id="album-art" src="" alt="" crossorigin="anonymous">
      </div>
      <div class="info" id="info">
        <div class="track-title" id="title">&nbsp;</div>
        <div class="track-artist" id="artist">&nbsp;</div>
        <div class="bottom-row">
          <span class="time-label" id="time">0:00 / 0:00</span>
          <div class="sp-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#1DB954" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
            </svg>
            <span>Spotify</span>
          </div>
        </div>
      </div>
    </div>
    <div class="viz-wrap"><canvas id="viz"></canvas></div>
  </div>

<script>
const card    = document.getElementById('card');
const artImg  = document.getElementById('album-art');
const glow    = document.getElementById('glow');
const ring    = document.getElementById('ring');
const titleEl = document.getElementById('title');
const artEl   = document.getElementById('artist');
const timeEl  = document.getElementById('time');
const infoEl  = document.getElementById('info');
const canvas  = document.getElementById('viz');
const ctx     = canvas.getContext('2d');

let accent = {r:30,g:185,b:84};
let track = null;
let isPlaying = false;
let progress = 0, duration = 1, progRef = 0;
let hiddenByPause = false;
let rafId = null;

const BARS = 72;
let bH = new Float32Array(BARS);
let tH = new Float32Array(BARS);
let lastTs = 0;

let pauseTimer1 = null, pauseTimer2 = null;
function clearPauseTimers(){
  clearTimeout(pauseTimer1); clearTimeout(pauseTimer2);
  pauseTimer1 = pauseTimer2 = null;
}
function startPauseTimers(){
  clearPauseTimers();
  pauseTimer1 = setTimeout(()=>card.classList.add('compact'), 5000);
  pauseTimer2 = setTimeout(()=>{
    card.classList.remove('show','paused','compact');
    hiddenByPause = true;
    stopDraw();
  }, 10000);
}
function resumeFromPause(){
  clearPauseTimers();
  hiddenByPause = false;
  card.classList.remove('compact','paused');
  if(!card.classList.contains('show')){
    setTimeout(()=>card.classList.add('show'), 50);
  }
  startDraw();
}

function resize(){
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = canvas.offsetWidth * dpr;
  canvas.height = canvas.offsetHeight * dpr;
}
new ResizeObserver(resize).observe(canvas);

function extractAccent(img){
  try{
    const c = document.createElement('canvas');
    c.width = c.height = 48;
    const cx = c.getContext('2d');
    cx.drawImage(img,0,0,48,48);
    const d = cx.getImageData(0,0,48,48).data;
    let bestSat = 0, br = 30, bg = 185, bb = 84;
    for(let i=0;i<d.length;i+=8){
      const r=d[i], g=d[i+1], b=d[i+2];
      const M=Math.max(r,g,b), m=Math.min(r,g,b);
      const sat = M===0 ? 0 : (M-m)/M;
      const bri = M/255;
      if(sat>bestSat && bri>0.18 && bri<0.96){
        bestSat=sat; br=r; bg=g; bb=b;
      }
    }
    accent = {r:br,g:bg,b:bb};
    const css = `rgba(${br},${bg},${bb},0.55)`;
    glow.style.background = css;
    card.style.setProperty('--accent', css);
    card.style.setProperty('--accent-solid', `rgb(${br},${bg},${bb})`);
  }catch(err){
    console.warn('[nowplaying] extraction couleur échouée (CORS ?)', err);
  }
}
artImg.addEventListener('load', ()=>extractAccent(artImg));

function easeOutExpo(x){ return x===1 ? 1 : 1-Math.pow(2,-10*x); }

function updateTargets(ts){
  const t = ts/1000;
  for(let i=0;i<BARS;i++){
    const p = i/BARS;
    if(!isPlaying){
      tH[i] = 0.035 + 0.025*Math.sin(t*0.5 + p*Math.PI*3);
    }else{
      const h =
        0.30*Math.abs(Math.sin(t*2.1 + p*Math.PI*5)) +
        0.24*Math.abs(Math.sin(t*3.4 + p*Math.PI*8)) +
        0.17*Math.abs(Math.sin(t*1.3 + p*Math.PI*3)) +
        0.09*Math.abs(Math.sin(t*5.6 + p*Math.PI*12)) +
        0.05*Math.random() - 0.025;
      tH[i] = Math.max(0.04, Math.min(1,h));
    }
  }
}

function fmt(ms){
  const s = Math.floor(ms/1000), m = Math.floor(s/60);
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

function buildWave(H){
  const step = canvas.width/(BARS-1);
  ctx.beginPath();
  ctx.moveTo(0, H/2);
  for(let i=0;i<BARS;i++){
    const px=i*step, py=H/2-bH[i]*H*0.42;
    if(i===0){ctx.lineTo(px,py);continue;}
    ctx.quadraticCurveTo((i-0.5)*step, H/2-bH[i-1]*H*0.42, px, py);
  }
  ctx.lineTo(canvas.width, H/2);
  for(let i=BARS-1;i>=0;i--){
    const px=i*step, py=H/2+bH[i]*H*0.42;
    if(i===BARS-1){ctx.lineTo(px,py);continue;}
    ctx.quadraticCurveTo((i+0.5)*step, H/2+bH[i+1]*H*0.42, px, py);
  }
  ctx.closePath();
}

function draw(ts){
  rafId = requestAnimationFrame(draw);
  const dt = Math.min((ts-lastTs)/1000, 0.05);
  lastTs = ts;

  if(isPlaying){
    progress = Math.min(duration, progress + (ts-progRef));
    progRef = ts;
    timeEl.textContent = `${fmt(progress)} / ${fmt(duration)}`;
  }
  updateTargets(ts);

  const k = isPlaying ? 1-Math.pow(1-Math.min(1,dt*11),1.6) : 1-Math.pow(1-Math.min(1,dt*4),1.6);
  for(let i=0;i<BARS;i++){ bH[i] += (tH[i]-bH[i])*k; }

  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  const {r,g,b} = accent;
  const prog = duration>0 ? progress/duration : 0;
  const pX = prog*W;

  buildWave(H);
  ctx.fillStyle = 'rgba(255,255,255,0.09)';
  ctx.fill();

  if(pX>1){
    ctx.save();
    ctx.beginPath(); ctx.rect(0,0,pX,H); ctx.clip();
    buildWave(H);
    const grad = ctx.createLinearGradient(0,0,pX,0);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.55)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0.95)`);
    ctx.fillStyle = grad;
    ctx.shadowColor = `rgba(${r},${g},${b},0.6)`;
    ctx.shadowBlur = 14*(window.devicePixelRatio||1);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  if(prog>0.004 && prog<0.998){
    ctx.beginPath();
    ctx.arc(pX, H/2, 5.5*(window.devicePixelRatio||1), 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,255,255,0.75)';
    ctx.shadowBlur = 11*(window.devicePixelRatio||1);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function startDraw(){
  if(rafId!==null) return;
  lastTs = performance.now();
  progRef = performance.now();
  rafId = requestAnimationFrame(draw);
}
function stopDraw(){
  if(rafId!==null){ cancelAnimationFrame(rafId); rafId = null; }
}

function applyTrack(t, isNew=false){
  if(!t){
    clearPauseTimers();
    hiddenByPause = false;
    card.classList.remove('show','paused','compact');
    track = null; isPlaying = false;
    stopDraw();
    return;
  }
  const wasPlaying = isPlaying;
  isPlaying = t.isPlaying;
  progress  = t.progress;
  duration  = t.duration || 1;
  progRef   = performance.now();

  if(!wasPlaying && isPlaying) resumeFromPause();
  if(wasPlaying && !isPlaying){ card.classList.add('paused'); startPauseTimers(); }
  if(isPlaying){ card.classList.remove('paused','compact'); clearPauseTimers(); }

  if(isNew || !track || track.id !== t.id){
    track = t;
    artImg.style.transform = 'scale(0.85) translateY(4px)';
    artImg.style.opacity = 0;
    setTimeout(()=>{
      artImg.src = t.albumArt;
      artImg.style.transform = 'scale(1) translateY(0)';
      artImg.style.opacity = 1;
    }, 260);
    infoEl.classList.add('changing');
    setTimeout(()=>{
      titleEl.textContent = t.title;
      artEl.textContent = t.artist;
      infoEl.classList.remove('changing');
    }, 240);
  }else{
    track = t;
  }

  if(!hiddenByPause && !card.classList.contains('show')){
    setTimeout(()=>card.classList.add('show'), 50);
  }
  startDraw();
}

let ws;
function connect(){
  const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${protocol}://${location.host}`);
  ws.onclose = ()=> setTimeout(connect, 3000);
  ws.onerror = ()=> ws.close();
  ws.onmessage = (e)=>{
    let m;
    try{ m = JSON.parse(e.data); }
    catch(err){ console.warn('[nowplaying] message WS invalide', err); return; }
    if(['init','newtrack','progress','track'].includes(m.type)){
      applyTrack(m.track, m.type==='newtrack');
    }
  };
}
connect();
</script>
</body>
</html>
