<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:transparent; overflow:hidden; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }

#card {
  position:fixed; bottom:28px; left:28px; width:360px;
  background:rgba(8,8,8,0.82);
  backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:18px; padding:16px 18px 14px;
  display:flex; flex-direction:column; gap:10px;
  transform:translateY(calc(100% + 40px)); opacity:0;
  will-change:transform,opacity;
  transition:
    transform 0.7s cubic-bezier(0.16,1,0.3,1),
    opacity 0.5s cubic-bezier(0.16,1,0.3,1),
    width 0.55s cubic-bezier(0.16,1,0.3,1),
    padding 0.55s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04) inset;
}
#card.show { transform:translateY(0); opacity:1; }
#card.compact { width:280px; padding:12px 14px; gap:12px; }
#card.compact .viz-wrap { max-height:0; opacity:0; }

.track-row { display:flex; align-items:center; gap:14px; }
.art-wrap { position:relative; flex-shrink:0; width:68px; height:68px; }
.art-img {
  position:absolute; inset:0; width:100%; height:100%; border-radius:10px;
  object-fit:cover; display:block; background:#1a1a1a;
  will-change:opacity,transform;
  transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1);
}
.art-img.inactive { opacity:0; transform:scale(0.9); }
.art-glow {
  position:absolute; inset:-6px; border-radius:18px; z-index:-1;
  opacity:0; filter:blur(16px);
  transition:opacity 0.9s cubic-bezier(0.16,1,0.3,1);
}
#card.show .art-glow.active { opacity:0.5; }

.info { flex:1; min-width:0; }
.marquee-mask { overflow:hidden; }
.marquee-inner { display:inline-flex; white-space:nowrap; }
.track-title {
  font-size:15px; font-weight:700; color:#fff;
  line-height:1.3; margin-bottom:4px;
  transition:opacity 0.3s ease, transform 0.3s cubic-bezier(0.16,1,0.3,1);
}
.track-artist {
  font-size:13px; color:rgba(255,255,255,0.5);
  margin-bottom:8px;
  transition:opacity 0.3s ease, transform 0.3s cubic-bezier(0.16,1,0.3,1);
}
.marquee-mask:not(.overflowing) .track-title,
.marquee-mask:not(.overflowing) .track-artist,
.info:not(.marquee-mask) { overflow:hidden; text-overflow:ellipsis; }
.info.changing .track-title,
.info.changing .track-artist { opacity:0; transform:translateY(-6px); }
.marquee-inner.scroll { animation:marquee var(--mq-dur,8s) cubic-bezier(0.45,0,0.55,1) infinite; }
@keyframes marquee {
  0%, 12%   { transform:translateX(0); }
  50%       { transform:translateX(var(--mq-x,0)); }
  88%, 100% { transform:translateX(0); }
}

.bottom-row { display:flex; align-items:center; justify-content:space-between; }
.time-label { font-size:11px; color:rgba(255,255,255,0.3); font-variant-numeric:tabular-nums; }
.sp-badge { display:flex; align-items:center; gap:5px; opacity:0.45; }
.sp-badge span { font-size:11px; font-weight:600; color:#fff; letter-spacing:0.03em; }

.viz-wrap {
  position:relative; height:18px; width:100%; overflow:hidden;
  transition:max-height 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.35s ease;
  max-height:18px; opacity:1;
}
#viz { width:100%; height:18px; display:block; transition:opacity 0.3s ease; }
#card.paused #viz { opacity:0.55; }

#card.paused .art-img.active { filter:brightness(0.65) saturate(0.5); }
#card.paused .track-title  { opacity:0.5; }
#card.paused .track-artist { opacity:0.3; }
.art-img { transition:opacity 0.5s cubic-bezier(0.16,1,0.3,1), transform 0.5s cubic-bezier(0.16,1,0.3,1), filter 0.45s ease; }

@media (prefers-reduced-motion: reduce) {
  #card, .art-img, .art-glow, .viz-wrap, .track-title, .track-artist { transition-duration:0.01s !important; }
  .marquee-inner.scroll { animation:none !important; }
}
</style>
</head>
<body>
<div id="card">
  <div class="track-row">
    <div class="art-wrap">
      <div class="art-glow" id="glowA"></div>
      <div class="art-glow" id="glowB"></div>
      <img class="art-img" id="artA" src="" alt="" crossorigin="anonymous">
      <img class="art-img" id="artB" src="" alt="" crossorigin="anonymous">
    </div>
    <div class="info" id="info">
      <div class="marquee-mask" id="titleMask"><div class="marquee-inner"><span class="track-title" id="title">—</span></div></div>
      <div class="marquee-mask" id="artistMask"><div class="marquee-inner"><span class="track-artist" id="artist">—</span></div></div>
      <div class="bottom-row">
        <span class="time-label" id="time">0:00 / 0:00</span>
        <div class="sp-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#1DB954" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          <span>Spotify</span>
        </div>
      </div>
    </div>
  </div>
  <div class="viz-wrap"><canvas id="viz"></canvas></div>
</div>

<script>
const card    = document.getElementById('card');
const artA    = document.getElementById('artA');
const artB    = document.getElementById('artB');
const glowA   = document.getElementById('glowA');
const glowB   = document.getElementById('glowB');
const titleEl = document.getElementById('title');
const artEl   = document.getElementById('artist');
const titleMask  = document.getElementById('titleMask');
const artistMask = document.getElementById('artistMask');
const timeEl  = document.getElementById('time');
const infoEl  = document.getElementById('info');
const canvas  = document.getElementById('viz');
const ctx     = canvas.getContext('2d');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// --- Crossfading album art + glow (two stacked layers, ping-ponged) ---
let artFront = artA, artBack = artB;
let glowFront = glowA, glowBack = glowB;
artFront.classList.add('active');
glowFront.classList.add('active');
artBack.classList.add('inactive');

function setArtwork(url) {
  artBack.classList.remove('inactive');
  artBack.style.opacity = '0';
  artBack.onload = () => {
    extractAccent(artBack, glowBack);
    requestAnimationFrame(() => {
      artFront.classList.add('inactive');
      artBack.classList.remove('inactive');
      artBack.style.transform = 'scale(1)';
      artBack.style.opacity = '';
      glowBack.classList.add('active');
      glowFront.classList.remove('active');
      [artFront, artBack] = [artBack, artFront];
      [glowFront, glowBack] = [glowBack, glowFront];
    });
  };
  artBack.style.transform = 'scale(0.9)';
  artBack.src = url;
}

function extractAccent(img, glowEl) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 48;
    const cx = c.getContext('2d'); cx.drawImage(img, 0, 0, 48, 48);
    const d = cx.getImageData(0, 0, 48, 48).data;
    let bestSat = 0, br = 30, bg = 185, bb = 84;
    for (let i = 0; i < d.length; i += 8) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const M = Math.max(r, g, b), m = Math.min(r, g, b);
      const sat = M === 0 ? 0 : (M - m) / M, bri = M / 255;
      if (sat > bestSat && bri > 0.18 && bri < 0.96) { bestSat = sat; br = r; bg = g; bb = b; }
    }
    accent = { r: br, g: bg, b: bb };
    glowEl.style.background = `rgba(${br},${bg},${bb},0.55)`;
  } catch (e) {}
}

// --- Marquee for overflowing titles ---
function refreshMarquee(mask) {
  const inner = mask.querySelector('.marquee-inner');
  inner.classList.remove('scroll');
  inner.style.transform = '';
  if (reduceMotion) return;
  requestAnimationFrame(() => {
    const overflow = inner.scrollWidth - mask.clientWidth;
    if (overflow > 4) {
      const dist = overflow + 18;
      mask.style.setProperty('--mq-x', `-${dist}px`);
      mask.style.setProperty('--mq-dur', `${Math.max(4.5, dist / 32 + 3)}s`);
      inner.classList.add('scroll');
    }
  });
}

// --- Visualizer state ---
let accent    = { r: 30, g: 185, b: 84 };
let track     = null;
let isPlaying = false;
let progress  = 0;
let duration  = 1;
let progRef   = 0;
let visProg   = 0;
let lastTs    = 0;
let pauseTimer = null;

function clearPauseTimer() { clearTimeout(pauseTimer); pauseTimer = null; }
function startPauseTimer() {
  clearPauseTimer();
  pauseTimer = setTimeout(() => card.classList.add('compact'), 5000);
}
function resumeFromPause() {
  clearPauseTimer();
  card.classList.remove('compact', 'paused');
  if (!card.classList.contains('show')) setTimeout(() => card.classList.add('show'), 50);
}

function resize() { canvas.width = canvas.offsetWidth * devicePixelRatio; canvas.height = canvas.offsetHeight * devicePixelRatio; }
resize();
new ResizeObserver(resize).observe(canvas);

function fmt(ms) { const s = Math.floor(ms / 1000), m = Math.floor(s / 60); return `${m}:${String(s % 60).padStart(2, '0')}`; }

function roundedRect(x, y, w, h, rad) {
  const rr = Math.max(0, Math.min(rad, h / 2, w / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}

function draw(ts) {
  requestAnimationFrame(draw);
  const dt = Math.min((ts - lastTs) / 1000, 0.05); lastTs = ts;
  if (isPlaying && progRef > 0) { progress = Math.min(duration, progress + (ts - progRef)); progRef = ts; }
  timeEl.textContent = `${fmt(progress)} / ${fmt(duration)}`;

  // Ease the displayed position toward the real one — this is what makes a
  // track change glide back to the start instead of snapping instantly.
  const pk = 1 - Math.exp(-9 * dt);
  visProg += (progress - visProg) * pk;

  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const { r, g, b } = accent;
  const frac = duration > 0 ? Math.min(1, Math.max(0, visProg / duration)) : 0;
  const barH = Math.max(2, Math.round(3 * devicePixelRatio));
  const cy = H / 2, top = cy - barH / 2, pX = frac * W;

  roundedRect(0, top, W, barH, barH / 2);
  ctx.fillStyle = 'rgba(255,255,255,0.10)'; ctx.fill();

  if (pX > 1) {
    roundedRect(0, top, pX, barH, barH / 2);
    const grad = ctx.createLinearGradient(0, 0, pX, 0);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.55)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0.95)`);
    ctx.fillStyle = grad; ctx.fill();
  }

  if (frac > 0.003 && frac < 0.997) {
    ctx.beginPath();
    ctx.arc(pX, cy, 3.6 * devicePixelRatio, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,255,255,0.55)'; ctx.shadowBlur = 5 * devicePixelRatio;
    ctx.fill(); ctx.shadowBlur = 0;
  }
}
requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(draw); });

function applyTrack(t, isNew = false) {
  if (!t) {
    clearPauseTimer();
    card.classList.remove('show', 'paused', 'compact');
    track = null; isPlaying = false; return;
  }

  const wasPlaying = isPlaying;
  isPlaying = t.isPlaying;
  progress  = t.progress;
  duration  = t.duration || 1;
  progRef   = performance.now();

  if (!wasPlaying && isPlaying) resumeFromPause();
  if (wasPlaying && !isPlaying) { card.classList.add('paused'); startPauseTimer(); }
  if (isPlaying) { card.classList.remove('paused', 'compact'); clearPauseTimer(); }

  if (isNew || !track || track.id !== t.id) {
    if (!track) visProg = progress;
    track = t;
    setArtwork(t.albumArt);
    infoEl.classList.add('changing');
    setTimeout(() => {
      titleEl.textContent = t.title;
      artEl.textContent = t.artist;
      infoEl.classList.remove('changing');
      refreshMarquee(titleMask);
      refreshMarquee(artistMask);
    }, 300);
  } else {
    track = t;
  }

  if (!card.classList.contains('show')) {
    setTimeout(() => card.classList.add('show'), 50);
  }
}

let ws, wsRetry = 0;
function connect() {
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.host}`);
  ws.onopen = () => { wsRetry = 0; };
  ws.onclose = () => { const delay = Math.min(10000, 800 * Math.pow(1.5, wsRetry++)); setTimeout(connect, delay); };
  ws.onerror = () => {};
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (['init', 'newtrack', 'progress', 'track'].includes(m.type)) applyTrack(m.track, m.type === 'newtrack');
  };
}
connect();
</script>
</body>
</html>
